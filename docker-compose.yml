services:
  flowmax-landing:
    build: .
    image: flowmax-landing:latest
    container_name: flowmax-landing
    restart: unless-stopped
    ports:
      - "3102:3102"
    environment:
      - NODE_ENV=production
      - PORT=3102
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3102/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
